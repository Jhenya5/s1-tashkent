function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function dec(pw){var k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(E.s),iterations:E.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
 var p=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(E.iv)},k,u8(E.ct));return JSON.parse(new TextDecoder().decode(p))}
async function tryOpen(pw,remember){var d;try{d=await dec(pw)}catch(e){document.getElementById("pe").textContent="Неверный пароль.";return false}
 if(remember){try{localStorage.setItem("uztt-instr-pw",pw)}catch(e){}}document.getElementById("gate").hidden=true;document.getElementById("main").hidden=false;init(d);return true}
document.getElementById("go").addEventListener("click",function(){tryOpen(document.getElementById("pw").value,document.getElementById("rem").checked)});
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("go").click()});
try{var sp=localStorage.getItem("uztt-instr-pw");if(sp)tryOpen(sp,false)}catch(e){}
function init(D){
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
var k=document.getElementById("key");k.innerHTML="<tr><th>№</th><th>Вопрос (№ в банке)</th><th>Ответ</th></tr>"+D.q.map(function(q,i){return "<tr><td class=n>"+(i+1)+"</td><td>"+esc(q.ru.q)+" <span class=muted>("+q.bank+")</span></td><td class=mono>"+q.a+") "+esc(q.ru.o["ABCD".indexOf(q.a)])+"</td></tr>"}).join("");
document.getElementById("in").addEventListener("input",function(){var v=this.value,o=document.getElementById("out");if(!v.trim()){o.innerHTML="";return}
 var parts=v.split("|").map(function(s){return s.trim()});var letters=(parts[parts.length-1]||"").replace(/\s+/g,"").toUpperCase();
 if(!/^[A-D-]{30}$/.test(letters)){o.innerHTML='<div class="res fail">Код не распознан: нужно 30 символов A–D или «-» в последней части кода.</div>';return}
 var ok=0,rows="",byT={};D.q.forEach(function(q,i){var g=letters[i],r=g===q.a;if(r)ok++;var t=D.topics[q.topic];byT[t]=byT[t]||[0,0];byT[t][1]++;if(r)byT[t][0]++;
  if(!r)rows+="<tr class=w><td class=n>"+(i+1)+"</td><td>"+esc(q.ru.q)+"</td><td class=mono>"+(g==="-"?"нет ответа":g+") "+esc(q.ru.o["ABCD".indexOf(g)]))+"</td><td class=mono>"+q.a+") "+esc(q.ru.o["ABCD".indexOf(q.a)])+"</td></tr>"});
 var pct=Math.round(ok/30*100),pass=ok>=24;
 var tt=Object.keys(byT).map(function(t){return "<tr><td>"+esc(t)+"</td><td class=n>"+byT[t][0]+" / "+byT[t][1]+"</td></tr>"}).join("");
 o.innerHTML='<div class="res"><div class="muted">'+esc(parts.slice(1,3).join(" · "))+'</div><div class="big '+(pass?"pass":"fail")+'">'+pct+' % · '+ok+' / 30 · '+(pass?"сдал":"не сдал")+'</div>'
 +'<p class="muted">Студенту сообщается только итог в процентах.</p><table><tr><th>Тема</th><th>Верно</th></tr>'+tt+'</table>'
 +(rows?'<table><tr><th>№</th><th>Вопрос</th><th>Ответ студента</th><th>Верно</th></tr>'+rows+'</table>':'')+'</div>'});
}
</script></body></html>
