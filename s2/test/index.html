<style>
:root{--bg:#f5f7f8;--surface:#fff;--ink:#18232b;--muted:#5a6873;--rule:#dbe2e6;--accent:#0f6f8a;--sel:#e3f2f6;--warn:#b3261e;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171c;--surface:#16212a;--ink:#e3eaee;--muted:#9aa9b3;--rule:#2a3843;--accent:#5cc2dc;--sel:#1b3540;--warn:#f2b8b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171c;--surface:#16212a;--ink:#e3eaee;--muted:#9aa9b3;--rule:#2a3843;--accent:#5cc2dc;--sel:#1b3540;--warn:#f2b8b5;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{font:500 13px/1.6 var(--mono);color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
h1{font-size:30px;line-height:1.15;margin:0}
.lang{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.lang button{border:0;background:var(--surface);color:var(--ink);padding:8px 12px;font:500 14px var(--sans);cursor:pointer}
@media (max-width:480px){.lang button{padding:8px 9px;font-size:13px}}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:20px 24px;margin-top:24px}
.honest{margin:0 0 16px;padding:12px 16px;border-left:4px solid var(--accent);background:var(--sel);border-radius:0 6px 6px 0;font-weight:500}
.rules{margin:0;padding-left:20px}
.rules li{margin:4px 0}
label.f{display:block;font-weight:500;margin:14px 0 6px}
input[type=text]{width:100%;max-width:360px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);font:16px var(--sans)}
.btn{display:inline-block;margin-top:18px;padding:11px 20px;border:0;border-radius:8px;background:var(--accent);color:var(--surface);font:600 16px var(--sans);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.err{color:var(--warn);font-size:14px;margin-top:8px;min-height:1em}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;padding:10px 0;margin-top:20px;font:500 15px var(--mono)}
.bar .t.low{color:var(--warn)}
h2{font-size:18px;margin:32px 0 4px;color:var(--accent)}
.note{font:14px/1.5 var(--mono);background:var(--sel);padding:8px 12px;border-radius:6px;margin:8px 0 0;overflow-wrap:anywhere}
.q{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 20px;margin-top:12px}
.q p{margin:0 0 10px;font-weight:500}
.q label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;cursor:pointer}
.q label:hover{background:var(--sel)}
.q input{margin-top:5px;accent-color:var(--accent)}
.q label.on{background:var(--sel)}
.q .L{font:600 14px/1.6 var(--mono);color:var(--muted);min-width:18px}
fieldset{border:0;margin:0;padding:0}
textarea{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--mono)}
.muted{color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:520px){h1{font-size:24px}.card,.q{padding:16px}}
.eyebrow a{color:inherit;text-decoration:none}
.eyebrow a:hover{color:var(--accent);text-decoration:underline}
</style>
</head>

<header>

</header>

<section class="card" id="intro">
  <p class="honest" data-i="honest"></p>
  <ul class="rules" data-i="rules"></ul>
  <label class="f" for="nm" data-i="name"></label><input id="nm" type="text" autocomplete="name">
  <label class="f" for="cid" data-i="cid"></label><input id="cid" type="text" inputmode="numeric" autocomplete="off">
  <div class="err" id="err"></div>

<div id="test" hidden>
  <div class="bar"><span id="cnt"></span><span class="t" id="tm"></span></div>

  <button class="btn" id="fin" type="button" data-i="finish"></button>
  <div id="confirm" hidden class="card"><p data-i="confirmText"></p><button class="btn" id="yes" type="button" data-i="yes"></button> <button class="btn ghost" id="no" type="button" data-i="no"></button></div>
</div>

<section class="card" id="done" hidden>

  <textarea id="code" readonly></textarea>

</section>

var $=function(i){return document.getElementById(i)},nm=$("nm"),cid=$("cid");

document.querySelectorAll("[data-c]").forEach(function(e){e.textContent=t.crumbs[+e.dataset.c]});document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang)});render();upd();if($("sendst"))st()}

D.q.forEach(function(q,i){if(q.topic!==last){last=q.topic;var h=document.createElement("h2");h.textContent=D.topics[lang][q.topic];box.appendChild(h);

 var d=document.createElement("fieldset");d.className="q";var p=document.createElement("p");p.textContent=(i+1)+". "+q[lang].q;d.appendChild(p);
 q[lang].o.forEach(function(o,j){var l=document.createElement("label");if(ans[i]===j)l.className="on";var r=document.createElement("input");r.type="radio";r.name="q"+i;r.checked=ans[i]===j;r.disabled=finished;

  var L=document.createElement("span");L.className="L";L.textContent="ABCD"[j];var s=document.createElement("span");s.textContent=o;l.appendChild(r);l.appendChild(L);l.appendChild(s);d.appendChild(l)});
 box.appendChild(d)})}

 if(end){var s=Math.max(0,Math.round((end-Date.now())/1000));$("tm").textContent=T[lang].left+": "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");$("tm").classList.toggle("low",s<=120)}}

 return "UZTT-S2V1 | "+nm.value.trim()+" | CID "+cid.value.trim()+" | "+g}

 var b=new URLSearchParams();b.append("entry.1725147629",nm.value.trim());b.append("entry.1337438438",cid.value.trim());b.append("entry.94430376","S2-V1");b.append("entry.1209481090",ans.map(function(a){return a===null?"-":"ABCD"[a]}).join("").match(/.{1,5}/g).join(" "));
 fetch(FORM,{method:"POST",mode:"no-cors",body:b}).then(function(){sendState="sent";st();save()},function(){sendState="sendFail";st();save()})}
